name: muslim_guide
description: A Flutter MVC Pattern project with GetX

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

    # /get x et intel format date 
  get: ^4.6.6
  intl: ^0.20.2
  flutter_timezone: ^4.1.1

  # gestion local secure storage shared pref
  flutter_secure_storage: ^10.0.0

  shared_preferences: ^2.2.2
  # notification 
  flutter_local_notifications: ^17.0.0 # Vérifie la dernière version
  timezone: ^0.9.2 # Requis pour la planification précise

  # permission 
  permission_handler: ^11.3.1


  # quibla 
  flutter_qiblah: ^3.1.0+1

  # icone & svg
  flutter_svg: ^2.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/quran_fr.json